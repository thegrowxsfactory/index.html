<style>
/* Layout: one step per screen on a centred stage; progress rail on top; gate before a partial reveal */
:root{
  --ink:#0A0900; --deep:#050505; --panel:#12100a; --line:#2a2516;
  --fg:#efe9da; --muted:#9a927e; --faint:#5e5747;
  --gold:#C9A84C; --gold-hi:#e6c86a; --gold-dim:rgba(201,168,76,.22);
  --display:"Inter",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:clamp(16px,5vw,56px);padding-block:0 40px;-webkit-font-smoothing:antialiased;min-height:100vh}
@media (pointer:fine){body,button,input,select,label,a{cursor:crosshair}}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--gold)}
.label{font-family:var(--display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gold{color:var(--gold)}
.tab{font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:center;padding-block:24px;gap:16px}
.top a{text-decoration:none}
.rail{display:flex;gap:6px}
.rail i{width:24px;height:2px;background:var(--line);display:block}
.rail i.on{background:var(--gold)}

.screen{position:relative;padding-block:clamp(20px,6vh,64px) 24px;display:grid;gap:26px;animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.ghost{position:absolute;right:-6px;top:0;font-family:var(--display);font-weight:500;font-stretch:100%;font-size:clamp(130px,24vw,240px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(201,168,76,.14);pointer-events:none;user-select:none}
.q{font-size:clamp(30px,5.4vw,52px);font-weight:700;font-stretch:100%;text-transform:uppercase;line-height:.98;max-width:17ch;position:relative}
.sub{color:var(--muted);font-size:17px;max-width:54ch;position:relative}
.sub b{color:var(--fg);font-weight:500}

.hero h1{font-size:clamp(50px,11vw,120px);line-height:.86;font-weight:500;font-stretch:100%;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{font-size:19px;color:var(--fg);font-weight:300}
.hero .sub b{color:var(--gold);font-weight:500}

.choices{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.choices.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.choices.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:700px){.choices.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.choices.c5{grid-template-columns:1fr}}
.ch{background:var(--deep);border:0;color:var(--fg);text-align:left;padding:16px;display:grid;gap:4px;font-family:var(--body);transition:background .15s;align-content:start}
.ch b{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.03em;font-stretch:100%;font-weight:700}
.ch span{font-size:12.5px;color:var(--muted);line-height:1.35}
.ch:hover{background:#15120b}
.ch[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 -2px 0 var(--gold)}
.ch[aria-pressed="true"] b{color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

.seg{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;max-width:100%;flex-wrap:wrap}
.seg button{background:var(--deep);border:0;color:var(--muted);font-family:var(--body);font-size:13px;padding:9px 13px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:600}
.asking{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.stmts{display:grid;border-top:1px solid var(--line)}
.st{display:grid;gap:10px;padding-block:16px;border-bottom:1px solid var(--line)}
.st .t{display:flex;gap:14px;align-items:baseline}
.st .n{font-family:var(--display);font-weight:500;font-stretch:100%;font-size:20px;color:var(--faint);min-width:28px}
.st p{font-size:17px}
.st .seg{margin-left:42px}
@media (max-width:600px){.st .seg{margin-left:0}}

.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:600px){.nums{grid-template-columns:1fr}}
.nf{display:grid;gap:10px;min-width:0}
.nf .row{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--gold);padding-bottom:6px}
.nf .pre,.nf .suf{font-family:var(--display);font-size:26px;color:var(--muted);font-stretch:100%}
.nf input{background:transparent;border:0;color:var(--fg);font-family:var(--display);font-weight:700;font-stretch:100%;font-size:clamp(42px,8vw,64px);width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.nf input:focus{outline:none}
.metric{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{background:var(--deep);color:var(--fg);border:1px solid var(--line);font-family:var(--display);font-size:15px;padding:8px 10px;letter-spacing:.03em}
.hint{font-size:13px;color:var(--faint)}
.line{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-family:var(--body);font-size:clamp(18px,2.6vw,22px);font-weight:300;padding:10px 0;width:100%}
.line:focus{outline:none;border-color:var(--gold)}
.line::placeholder{color:var(--faint)}

/* gate */
.gate{display:grid;gap:18px;max-width:560px}
.gate .f{display:grid;gap:6px}
.consent{font-size:12.5px;color:var(--faint);max-width:56ch}
.err{font-size:13px;color:var(--gold-hi)}

.nav{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:10px}
.btn{background:var(--gold);color:var(--ink);border:1px solid var(--gold);font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12.5px;padding:15px 26px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--gold-hi)}
.btn[disabled]{opacity:.3}
.link{background:none;border:0;color:var(--muted);font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:600;padding:8px 0}
.link:hover{color:var(--gold)}

/* reveal */
.reveal{gap:30px}
.bignum{font-family:var(--display);font-weight:500;font-stretch:100%;font-size:clamp(110px,26vw,250px);line-height:.8;color:var(--gold);letter-spacing:-.02em}
.bignum small{display:block;font-size:clamp(15px,2.2vw,20px);font-stretch:100%;color:var(--fg);letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-top:14px}
.verdict{font-size:clamp(19px,2.6vw,25px);font-weight:300;line-height:1.42;max-width:40ch}
.verdict b{color:var(--gold);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--gold)}
.stat{padding:16px 16px 4px 0;display:grid;gap:6px;align-content:start}
.stat+.stat{padding-left:16px;border-left:1px solid var(--line)}
.stat .n{font-family:var(--display);font-weight:700;font-stretch:100%;font-size:clamp(28px,4.4vw,42px);line-height:1}
.stat .c{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:1fr}.stat+.stat{padding-left:0;border-left:0;border-top:1px solid var(--line)}}

.bench{display:grid;gap:10px}
.bench .tr{position:relative;height:14px;background:var(--line)}
.bench .band{position:absolute;top:0;bottom:0;left:60%;width:15%;background:var(--gold-dim);outline:1px dashed rgba(201,168,76,.5);outline-offset:-1px}
.bench .mk{position:absolute;top:-7px;width:2px;height:28px;background:var(--gold)}
.bench .sc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.bench p{font-size:15px;color:var(--muted)}
.bench p b{color:var(--fg);font-weight:500}

.locked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media (max-width:640px){.locked{grid-template-columns:1fr}}
.lk{background:var(--deep);padding:18px;display:grid;gap:8px;align-content:start}
.lk .v{font-family:var(--display);font-weight:700;font-stretch:100%;font-size:30px;color:var(--gold);filter:blur(7px);user-select:none}
.lk .c{font-size:13px;color:var(--muted)}
.lk .k{font-family:var(--display);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600}

.cta{border-top:1px solid var(--gold);padding-top:26px;display:grid;gap:16px}
.cta h3{font-size:clamp(24px,3.8vw,36px);font-weight:700;font-stretch:100%;text-transform:uppercase;line-height:1;max-width:20ch}
.cta .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cta code{font-family:var(--mono);font-size:14px;background:var(--panel);border:1px solid var(--line);padding:9px 11px;user-select:all}
.btn.ol{background:transparent;color:var(--gold);padding:10px 16px}
.btn.ol:hover{background:var(--gold);color:var(--ink)}
.fine{font-size:12px;color:var(--faint)}

.ring{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;z-index:10;opacity:0;transition:width .15s,height .15s,margin .15s}
@media (prefers-reduced-motion:reduce){.ring{display:none}*{animation:none!important;transition:none!important}}
</style>

<style id="skin">
.anc{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-right:6px;border:1px solid rgba(201,168,76,.6);color:#C9A84C;font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.04em;vertical-align:1px;text-transform:none}

/* Immersive skin shared with the intro page */
:root{--display:"Inter",system-ui,sans-serif!important;--brand:"Inter",system-ui,sans-serif!important;--serif:"Inter",system-ui,sans-serif!important;--body:"Inter",system-ui,sans-serif!important;
  --ink:rgba(0,0,0,.42);--deep:rgba(0,0,0,.6);--panel:rgba(16,13,6,.74);--bg:rgba(0,0,0,.42);
  --sk-fg:#f4efe2;--sk-muted:rgba(244,239,226,.62);--sk-faint:rgba(244,239,226,.34);--sk-line:rgba(244,239,226,.14);--sk-gold:#C9A84C;--sk-gold-hi:#e6c86a}
html,body{background:#000!important}
body{font-family:"Inter",system-ui,sans-serif!important;font-weight:300}
nav.nav,nav#rail{display:none!important}
h1,h2,h3,.h2,.q,.big,.bignum{text-transform:none!important;font-stretch:100%!important;letter-spacing:-.025em!important}
h1,.h2,h2,.q{font-weight:200!important}
h3{font-weight:400!important;letter-spacing:-.01em!important}
h1 em,h2 em,.h2 em{font-weight:300!important}
.btn{border-radius:999px!important;text-transform:none!important;letter-spacing:.01em!important;font-weight:400!important;font-family:"Inter",system-ui,sans-serif!important;font-size:15px!important;padding:13px 24px!important}
.seg,.seg button,.conv,.choices{border-radius:0}
.seg button[aria-pressed="true"]{background:#f4efe2!important;color:#000!important}

section,.pillars{background:transparent}
.ghost{display:none!important}
.SKIN-CHROME{}
/* the field */
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:#000}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%)}
.page{position:relative;z-index:1}

/* chrome */
.chrome{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) clamp(16px,3vw,36px) 18px;pointer-events:none}
.chrome>*{pointer-events:auto}
.mark{width:46px;height:46px;background:#000;border:1px solid var(--sk-line);display:grid;place-items:center;text-decoration:none;font-family:"DM Mono",ui-monospace,monospace;color:var(--sk-gold);font-size:18px}
.mark:hover{border-color:var(--sk-gold)}
.chrome-r{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(244,239,226,.55);border-radius:999px;padding:12px 22px;font-family:"Inter",system-ui,sans-serif;font-weight:400;font-size:15px;letter-spacing:.01em;color:var(--sk-fg);text-decoration:none;background:transparent;transition:background .25s,color .25s,border-color .25s}
.pill:hover{background:var(--sk-fg);color:#000;border-color:var(--sk-fg)}
.pill.gold{border-color:var(--sk-gold);color:var(--sk-gold)}
.pill.gold:hover{background:var(--sk-gold);color:#000}
.pill.solid{background:var(--sk-gold);border-color:var(--sk-gold);color:#000}
.pill.solid:hover{background:var(--sk-gold-hi);border-color:var(--sk-gold-hi)}
.pill .ar{font-family:"DM Mono",ui-monospace,monospace;transition:transform .25s}.pill:hover .ar{transform:translate(2px,-2px)}
.chrome .pill{padding:11px 18px;font-size:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.burger{width:46px;height:46px;background:#000;border:1px solid var(--sk-line);display:grid;place-content:center;gap:7px;padding:0}
.burger i{display:block;width:22px;height:1px;background:var(--sk-fg);transition:transform .3s,opacity .3s}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(4px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){transform:translateY(-4px) rotate(-45deg)}
@media (max-width:560px){.chrome .pill{display:none}}

/* menu overlay */
.menu{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;align-content:center;padding:100px clamp(20px,4vw,48px) 60px;opacity:0;pointer-events:none;transition:opacity .35s}
.menu.open{opacity:1;pointer-events:auto}
.menu nav{display:grid;gap:clamp(6px,1.4vw,14px)}
.menu nav a{font-size:clamp(30px,4.6vw,56px);font-weight:300;text-decoration:none;color:var(--sk-fg);letter-spacing:-.01em;display:inline-flex;gap:14px;align-items:baseline;width:max-content;max-width:100%;transition:color .2s,transform .3s}
.menu nav a:hover{color:var(--sk-gold);transform:translateX(6px)}
.menu nav a small{font-family:"DM Mono",ui-monospace,monospace;font-size:13px;color:var(--sk-faint)}
.menu .meta{margin-top:48px;display:flex;gap:12px 32px;flex-wrap:wrap;color:var(--sk-muted);font-size:14px}
.menu .meta a{color:var(--sk-gold);text-decoration:none}


.chrome .pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(244,239,226,.55);border-radius:999px;color:var(--sk-fg);text-decoration:none;font-weight:400}
.chrome .pill:hover{background:var(--sk-fg);color:#000}
#field{z-index:0}.veil{z-index:0}
body>*:not(#field):not(.veil):not(.chrome):not(.menu):not(.ring):not(.mcta):not(script){position:relative;z-index:1}
</style>

}

 csuite:{name:'C-Suite Leaders',d:'CEOs, COOs, CFOs, group heads',m:[['EBITDA','M'],['Revenue','M'],['Total shareholder return','%']],

  D:[['Agreed growth targets the board found comfortable','01'],['Entered one market when the case was for three','09'],['Kept founding-era structures past their time','04'],['Promoted loyalty over capability','08'],['Accepted the board’s pace over your own','03'],['Under-invested in your own visibility','07']]},

  D:[['Approved a plan you thought lacked ambition','01'],['Stayed silent on a decision you disagreed with','08'],['Deferred to a dominant chair or CEO','04'],['Avoided a leadership change you knew was due','03'],['Accepted a mandate below your experience','05'],['Let your reputation stay in a narrow circle','10']]},

 sovereign:{name:'Elite Sovereigns',d:'Principals of significant private capital',m:[['Capital deployed with conviction','M'],['Net worth','M']],
  D:[['Spread capital thin instead of making a decisive bet','09'],['Let advisors set your appetite for risk','04'],['Delegated a decision you should have owned','08'],['Chose comfort over a legacy-scale project','01'],['Kept your influence private when it could shape outcomes','10'],['Settled for status over impact','05']]}
};
const AS={me:['Myself','you','You','your'],team:['My team','your team','Your team','your team’s'],org:['My organisation','your organisation','Your organisation','your organisation’s'],peers:['Me, with peers','you','You','your'],heir:['As a successor','you','You','your']};
const TAKE=[[100,'Did not settle'],[90,'Took 90%'],[70,'Took 70%'],[50,'Half or less']];
const CERT=[[20,'Long shot','I would be surprised'],[40,'Ambitious','Possible, if a lot goes right'],[60,'Likely','More likely than not'],[80,'Expected','I would be surprised if not'],[95,'Inevitable','A foregone conclusion']];
const ROUTE={me:'GROW$X Blueprint · GROW$XOne (or GROW$XTribe)',team:'GROW$X Blueprint · GROW$XTeam (or Career Kaihagyo · Succession Planning)',heir:'GROW$X Autonomy · NextGen Bespoke (or one-to-one / NextGen Tribe)'};

const PRIOR_SCORE=(()=>{try{return (new URLSearchParams(location.search).get('score')||'').replace(/[^0-9]/g,'').slice(0,3)}catch(_){return ''}})();
const fresh=()=>({ch:null,as:'me',take:Array(6).fill(null),metric:0,cur:'€',now:'',edge:'',cert:null,self:'',name:'',email:'',org:''});

try{const q=new URLSearchParams(location.search);const ch=q.get('ch'),as=q.get('as');if(ch&&CH[ch])s.ch=ch;if(as&&AS[as])s.as=as;}catch(_){}const N=6;
const $=id=>document.getElementById(id);
const C=()=>CH[s.ch||'csuite'],A=()=>{if(s.as==='heir'&&!['family','sovereign'].includes(s.ch))s.as='me';return AS[s.as]};

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(v){const u=C().m[s.metric][1],c=s.cur,sp=c.length>1?' ':'';const r=v>=100?Math.round(v):Math.round(v*10)/10;
  if(u==='M')return c+sp+r+'M';if(u==='K')return c+sp+r+'K';if(u==='x')return (Math.round(v*100)/100)+'×';return r+'%';}

  const settle=Math.round(s.take.reduce((x,y)=>x+y,0)/6),now=num(s.now),edge=num(s.edge);
  const worst=s.take.map((v,i)=>[v,i]).filter(x=>x[0]<100).sort((p,q)=>p[0]-q[0]||p[1]-q[1]).slice(0,3);
  return {settle,d:100-settle,now,edge,past:edge/(settle/100),stretch:Math.round((edge/now-1)*100),worst};
}

  rail();let h='';const a=A();
  if(step===0){
    h=`<section class="screen hero">
      <span class="label gold"><i class="anc">GROW</i><i class="anc">$</i>PRIME reading · part 1 of 2 · your baseline</span>

    </section>`;

      <div class="stmts">${C().D.map((d,i)=>`<div class="st"><div class="t"><span class="n">${String(i+1).padStart(2,'0')}</span><p>${d[0]}</p></div>
        <div class="seg" role="group" aria-label="${esc(d[0])}">${TAKE.map(([v,l])=>`<button id="t${i}-${v}" data-i="${i}" data-v="${v}" aria-pressed="${s.take[i]===v}">${l}</button>`).join('')}</div></div>`).join('')}</div>
      ${nav(s.take.every(v=>v!==null))}</section>`;
  }
  if(step===2){
    const m=C().m,u=m[s.metric][1],money=u==='M'||u==='K',suf=u==='x'?'×':u==='%'?'%':u;
    h=`<section class="screen"><div class="ghost">02</div>
      <span class="label gold">02 · The Possibility Horizon</span>
      <h2 class="q">The edge of what ${a[1]} believe${(s.as==='team'||s.as==='org')?'s':''}</h2>

      <div class="nums">
        <div class="nf"><label class="label" for="now">Today</label><div class="row">${money?`<span class="pre">${s.cur}</span>`:''}<input id="now" type="number" inputmode="decimal" min="0" step="0.1" value="${s.now}" placeholder="0"><span class="suf">${suf}</span></div></div>
        <div class="nf"><label class="label" for="edge">In three years, at the very edge of belief</label><div class="row">${money?`<span class="pre">${s.cur}</span>`:''}<input id="edge" type="number" inputmode="decimal" min="0" step="0.1" value="${s.edge}" placeholder="0"><span class="suf">${suf}</span></div></div>
      </div>
      <p class="hint">Not the plan. The highest number ${a[1]} could say out loud and still believe.</p>
      ${nav(num(s.now)>0&&num(s.edge)>0)}</section>`;
  }
  if(step===3){
    h=`<section class="screen"><div class="ghost">03</div>
      <span class="label gold">03 · Ambitious or inevitable</span>

  /* 4 · signal — ridgelines of performance over time */
  const waves={init(){},trail:1,
    draw(){const L=46,top=H*.22,bot=H*.92,x0=W*.28,x1=W*.98;
      for(let l=0;l<L;l++){const y0=top+(bot-top)*l/L,pts=[];
        for(let i=0;i<=120;i++){const u=i/120,x=x0+(x1-x0)*u,c=Math.exp(-Math.pow((u-.55)/.18,2));
          const v=Math.max(0,noise(u*6,l*.35,t*.0009)+.4)*c*H*.09+Math.abs(Math.sin(u*40+l+t*.002))*c*H*.008;pts.push([x,y0-v]);}
        ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineTo(x1,bot+40);ctx.lineTo(x0,bot+40);ctx.closePath();ctx.fillStyle='#000';ctx.fill();
        ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
        const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,gold(0,0));g.addColorStop(.25,gold(l%9===0?1:0,.25+.6*(l/L)));g.addColorStop(.85,gold(l%9===0?1:0,.25+.6*(l/L)));g.addColorStop(1,gold(0,0));
        ctx.strokeStyle=g;ctx.lineWidth=1.1*D;ctx.stroke();}}};

  /* 5 · network — the relationships that decide */
  const net={init(){const n=Math.round(Math.min(170,innerWidth*innerHeight/9000));this.p=[];for(let i=0;i<n;i++)this.p.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*D,vy:(Math.random()-.5)*.35*D,r:Math.random()});this.pulses=[];},
    trail:.35,
    draw(){const P=this.p,lim=Math.min(W,H)*.17;for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
      ctx.lineWidth=.8*D;
      for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<lim){ctx.strokeStyle=gold(0,(1-d/lim)*.45);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        if(Math.random()<.0009&&this.pulses.length<40)this.pulses.push({a,b,u:0});}}
      for(const p of P){ctx.fillStyle=gold(p.r>.9?3:1,.5+p.r*.5);const r=(1.2+p.r*2.4)*D;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill();}
      ctx.globalCompositeOperation='lighter';
      this.pulses=this.pulses.filter(q=>{q.u+=.02;const x=q.a.x+(q.b.x-q.a.x)*q.u,y=q.a.y+(q.b.y-q.a.y)*q.u;const g=ctx.createRadialGradient(x,y,0,x,y,10*D);g.addColorStop(0,'rgba(244,230,180,.9)');g.addColorStop(1,'rgba(201,168,76,0)');ctx.fillStyle=g;ctx.fillRect(x-10*D,y-10*D,20*D,20*D);return q.u<1;});
      ctx.globalCompositeOperation='source-over';}};

  const SC=[flow,tunnel,sphere,columns,waves,net];
  function size(){D=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';SC.forEach(s=>s.init());ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
  function frame(){const sc=SC[S];
    ctx.fillStyle=`rgba(0,0,0,${sc.trail})`;ctx.fillRect(0,0,W,H);sc.draw();
    if(next>=0){fade+=.045;ctx.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;ctx.fillRect(0,0,W,H);if(fade>=1){S=next;next=-1;fade=0;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}}
    t+=16;}
  function loop(){frame();requestAnimationFrame(loop);}
  addEventListener('resize',()=>{clearTimeout(size.t);size.t=setTimeout(size,150);});
  size();
  window.growxField=i=>{i=((i%SC.length)+SC.length)%SC.length;if(i===S&&next<0)return;if(reduce){S=i;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);for(let k=0;k<60;k++)frame();return;}next=i;fade=0;};
  const start=+(document.documentElement.dataset.scene||0);S=start%SC.length;
  if(reduce){for(let k=0;k<80;k++)frame();}else loop();
  /* pages other than the intro: each section brings its own scene */
  if(!document.getElementById('bars')&&'IntersectionObserver' in window){
    const secs=[...document.querySelectorAll('section')];
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)growxField(start+secs.indexOf(e.target));}),{threshold:.4});
    secs.forEach(s=>io.observe(s));}
})();

/* ---------- menu ---------- */
(function(){const b=document.getElementById('burger'),m=document.getElementById('menu');
  const set=o=>{m.classList.toggle('open',o);b.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':'';};
  b.addEventListener('click',()=>set(!m.classList.contains('open')));
  m.addEventListener('click',e=>{if(e.target.closest('a'))set(false);});
  addEventListener('keydown',e=>{if(e.key==='Escape')set(false);});})();

</script>




<script id="polish-js">
/* art at full strength on stage zones; dimmed under reading content */
(function(){var f=document.getElementById('field');if(!f||!('IntersectionObserver' in window))return;
var on=new Set(),st=document.querySelectorAll('[data-stage]');
function set(){f.style.opacity=on.size?'1':'.28'}
var io=new IntersectionObserver(function(es){es.forEach(function(e){e.isIntersecting?on.add(e.target):on.delete(e.target)});set()},{rootMargin:'-35% 0px -35% 0px'});
st.forEach(function(el){io.observe(el)});set();})();
</script>
<script id="hub-js">
/* carries results between pages so every GROW$X line can show where the reader stands */
(function(){
  function get(k){try{return localStorage.getItem(k)}catch(_){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(_){}}
  var q;try{q=new URLSearchParams(location.search)}catch(_){q=null}
  var d=q&&(q.get('baseline')||'').replace(/[^0-9]/g,''),t=q&&(q.get('score')||'').replace(/[^0-9]/g,'');
  if(d)set('gx_d',d);if(t)set('gx_t',t);
  window.gxSave=function(k,v){set(k,String(v));paint()};
  function paint(){if(!window.GX)return;var d=get('gx_d'),t=get('gx_t');
    document.querySelectorAll('.gxl').forEach(function(f){
      var r=f.querySelector('[data-gx="restore"]'),m=f.querySelector('[data-gx="multiply"]'),x=f.querySelector('[data-gx="x"]');
      if(r)r.textContent=d?GX.f(GX.restore(d)):'×';
      if(m)m.textContent=t?GX.f(GX.multiply(t)):'×';
      if(x)x.textContent=(d&&t)?'= '+GX.f(GX.x(d,t)):'';
      f.classList.toggle('has-x',!!(d&&t));});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',paint);else paint();
  document.addEventListener('growx:score',function(e){if(e.detail&&e.detail.total)window.gxSave('gx_t',e.detail.total)});
})();
</script>
<script id="rring-js">
document.addEventListener('DOMContentLoaded',function(){
  var stage=document.getElementById('stage'),rail=document.getElementById('rail');if(!stage||!rail)return;
  var L=[['01','Your seat'],['02','Six decisions'],['03','Your horizon'],['04','Certainty'],['05','Send'],['06','Your baseline']];
  var grid=document.createElement('div');grid.className='rv-grid';
  var ring=document.createElement('div');ring.className='rv-ring';
  ring.innerHTML='<svg viewBox="-20 -20 440 440" role="img" aria-label="PRIME part 1 progress"></svg><div class="rv-c"><span>PRIME · part 1 of 2</span><b id="rvNum">01</b><em id="rvName">Your seat</em></div>';
  stage.parentNode.insertBefore(grid,stage);grid.appendChild(ring);grid.appendChild(stage);
  var svg=ring.querySelector('svg'),C=200,R1=196,R0=138,GAP=2;
  function pt(r,a){return [C+r*Math.cos(a*Math.PI/180),C+r*Math.sin(a*Math.PI/180)]}
  var h='';for(var i=0;i<6;i++){var a0=-90+i*60+GAP,a1=-90+(i+1)*60-GAP,p0=pt(R1,a0),p1=pt(R1,a1),p2=pt(R0,a1),p3=pt(R0,a0),t=pt((R1+R0)/2,(a0+a1)/2);
    h+='<g class="sg" data-i="'+i+'"><path d="M'+p0+' A'+R1+','+R1+' 0 0 1 '+p1+' L'+p2+' A'+R0+','+R0+' 0 0 0 '+p3+'Z"/><text x="'+t[0].toFixed(1)+'" y="'+(t[1]+4).toFixed(1)+'" text-anchor="middle">'+L[i][0]+'</text></g>';}
  h+='<circle cx="200" cy="200" r="124" fill="none" stroke="rgba(201,168,76,.14)"/>';svg.innerHTML=h;
  function paint(){var step=rail.querySelectorAll('i.on').length-1;if(step<0)step=0;
    svg.querySelectorAll('.sg').forEach(function(g){var i=+g.dataset.i;g.classList.toggle('done',i<step||step===5);g.classList.toggle('cur',i===step&&step<5);});
    var num=document.getElementById('rvNum'),nm=document.getElementById('rvName');
    if(step===5){var b=stage.querySelector('.bignum');num.textContent=b?(b.firstChild&&b.firstChild.textContent||'').trim():'';nm.textContent='of your baseline';}
    else{num.textContent=L[step][0];nm.textContent=L[step][1];}}
  new MutationObserver(paint).observe(rail,{childList:true,subtree:true,attributes:true});
  new MutationObserver(paint).observe(stage,{childList:true});paint();
});
</script>

<script id="emote-js">
document.addEventListener('DOMContentLoaded',function(){
  var g=function(k){try{return localStorage.getItem(k)}catch(_){return null}},st=function(k,v){try{localStorage.setItem(k,v)}catch(_){}};
  /* proof and intake blocks */
  var P=window.GX_PROOF||[],I=window.GX_INTAKE||{};
  document.querySelectorAll('.proof').forEach(function(el){if(!P.length)return;el.classList.add('on');el.querySelector('.proof-g').innerHTML=P.slice(0,3).map(function(c){return '<div><small>'+c.seat+' · '+c.months+' months</small><b>'+c.before+' → '+c.after+'</b><span>'+(c.note||'')+'</span></div>'}).join('');});
  document.querySelectorAll('.intake').forEach(function(el){if(!I.leaders&&!I.teams)return;el.classList.add('on');el.innerHTML='<span>Intake by application · <b>'+[I.leaders&&(I.leaders+' new leaders'),I.teams&&(I.teams+' teams')].filter(Boolean).join(' and ')+'</b> per quarter'+(I.closes?' · next intake closes <b>'+I.closes+'</b>':'')+'</span>';});
  /* personal bar */
  if(g('gx_bar_off')==='1')return;var d=g('gx_d'),t=g('gx_t'),gap=g('gx_gap');if(!d&&!t)return;

  var bar=document.createElement('div');bar.className='gxbar';bar.setAttribute('role','region');bar.setAttribute('aria-label','Your PRIME reading');
  bar.innerHTML='<span class="t">Your reading: '+bits.join(' · ')+'</span><a href="factory.html#book">Reserve your 90 minutes</a><button type="button" aria-label="Hide">×</button>';
  document.body.appendChild(bar);setTimeout(function(){bar.classList.add('show')},900);
  bar.querySelector('button').addEventListener('click',function(){bar.classList.remove('show');st('gx_bar_off','1');});
  var bk=document.getElementById('book');if(bk&&'IntersectionObserver' in window)new IntersectionObserver(function(es){es.forEach(function(x){bar.classList.toggle('show',!x.isIntersecting)})},{threshold:.1}).observe(bk);
});
</script>
