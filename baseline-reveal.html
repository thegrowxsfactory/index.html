  const bg=$('begin');if(bg)bg.onclick=()=>{try{const c=JSON.parse(ls.get('gx_ctx')||'{}');c.ch=s.ch;c.as=s.as;c.w=s.as==='heir'?'me':(['team','org','peers'].includes(s.as)?s.as:'me');if(s.as==='heir')c.role='heir';ls.set('gx_ctx',JSON.stringify(c));}catch(_){}scr='r1';i=0;render(true);};
  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const bk=$('back');if(bk)bk.onclick=()=>{if(scr==='r1'){if(i>0)i--;else scr='intro';}else if(scr==='mid'){if(dStored!=null&&s.take.every(v=>v==null)){scr='intro';}else{scr='r1';i=5;}}else if(scr==='r2'){if(i>0)i--;else scr='mid';}else if(scr==='gate'){scr='r2';i=9;}render(true);};
  const nx=$('next');if(nx)nx.onclick=()=>{scr='r2';i=0;render(true);};
  const rt=$('retake');if(rt)rt.onclick=()=>{s.take=Array(6).fill(null);s.ans=Array(10).fill(null);scr='intro';render(true);};
  const g=$('gate');if(g)g.onsubmit=async e=>{e.preventDefault();
    s.name=$('nm').value.trim();s.email=$('em').value.trim();s.org=$('org').value.trim();s.phone=$('ph').value.trim();s.ok=$('okb').checked;
    if(!s.name){$('nm').focus();return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email)){const er=$('err');er.textContent='Add a valid email to see your X.';er.hidden=false;$('em').focus();return;}
    try{const L=JSON.parse(ls.get('gx_lead')||'{}');Object.assign(L,{name:s.name,email:s.email,org:s.org,phone:s.phone,ok:s.ok,p1:Date.now()});ls.set('gx_lead',JSON.stringify(L));}catch(_){}
    const btn=$('reveal');btn.disabled=true;btn.textContent='Calculating…';
    send();scr='result';render(true);scrollTo({top:0});};
}
addEventListener('keydown',e=>{if(!(scr==='r1'||scr==='r2'))return;if(e.target.tagName==='INPUT')return;const n=scr==='r1'?4:5,k=+e.key;
  if(k>=1&&k<=n){pick(k-1);return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const cur=scr==='r1'?(s.take[i]==null?-1:TAKE.findIndex(t=>t[0]===s.take[i])):(s.ans[i]==null?-1:VAL.indexOf(s.ans[i]));
    const nk=Math.max(0,Math.min(n-1,cur+(e.key==='ArrowRight'?1:-1)));const b=document.querySelectorAll('.stop')[nk];if(b)b.focus();}});
addEventListener('resize',()=>gauge());
/* ---------- the lead e-mail (1 per reading) ---------- */
async function send(){
  const c=C(),d=d1(),t=tScore(),xv=fx(X(d,t)),w=who();
  const worst=s.take.map((v,k)=>[v,k]).filter(x=>x[0]<100).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,3);
  const low=s.ans.map((v,k)=>[v,k]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,3).map(x=>x[1]);
  const first=s.name.split(/\s+/)[0];
  const by=Math.round((100/Math.max(1,100-d)-1)*100);
  const reply=first+', your Ceiling Reading:\n\n① Left on the table: '+d+' points below your baseline.\n② Left unrealised: '+t+'% of your full potential in use.\n= Your X: '+xv+', what closing both unlocks.\n\nWhere you could be by now, with the settling removed: +'+by+'% on what you deliver today.\nHeld hardest by: '+low.map(k=>PV[k].n+' '+PV[k].nm).join(', ')+'.\nWhere SCALE starts: '+low.map((k,j)=>'Month '+(j+1)+' · '+PV[k].nm).join(' → ')+'.\n\nWhy each pivot holds you, and your 10-month plan, are what we read with you in your private 90-minute Strategy Session.\n\nChoose a time: '+CONFIG.calendly+'\n\nThe Grow$X Factory\nGrow the leader. Multiply the result.';
  const body={_subject:(s.ok?'✅ CONTACT OK':'Reading only')+' · Ceiling Reading · '+s.name+' · −'+d+' pts · '+t+'% · X '+xv+' · '+c.name,_template:'table',_captcha:'false',_autoresponse:reply,
    name:s.name,email:s.email,_replyto:s.email,organisation:s.org||'—',phone:s.phone||'—',
    consent_to_contact:s.ok?'YES · '+new Date().toISOString()+' · “'+CONSENT+'”':'NO · reading only, do not contact',
    chapter:c.name,answering_for:w[0],points_below_baseline:d,potential_in_use:t+'%',your_x:xv,
    settled_most:worst.map(([v,k])=>c.D[k][1]+' ('+v+'%): '+c.D[k][0]).join(' | ')||'none',
    held_hardest_by:low.map(k=>PV[k].n+' '+PV[k].nm).join(', '),
    audit:c.D.map((dd,k)=>dd[0]+': '+s.take[k]+'%').join(' | '),
    pivots:PV.map((p,k)=>p.n+' '+p.nm+': '+s.ans[k]+'/10').join(' | ')};
  try{await fetch(CONFIG.leadEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});}catch(_){}
}
render(false);
/* ---------- intro, as on the main site ---------- */
(function(){const box=$('tpi');const T=[[200,'Time Zero: <em>where you lead from today.</em>','q'],[3200,'2 readings. 8 minutes. <em>Your multiple, revealed.</em>','end']];
  const END=T[T.length-1][0]+3400,key='gx_tpi_ceiling';let t0=0,raf=0,shown=-1,done=false;
  function line(k){const p=$('tpiLine');p.classList.add('out');setTimeout(()=>{p.innerHTML=T[k][1];p.className=T[k][2]||'';},reduce?0:340);if(window.growxField)growxField([1,4][k%2]);}
  function finish(){if(done)return;done=true;cancelAnimationFrame(raf);box.classList.add('done');document.documentElement.classList.remove('tpi-on');try{sessionStorage.setItem(key,'1')}catch(_){}}
  function tick(now){if(!t0)t0=now;const ms=now-t0;$('tpiBar').style.width=Math.min(100,ms/END*100)+'%';for(let k=T.length-1;k>=0;k--){if(ms>=T[k][0]){if(k!==shown){shown=k;line(k);}break;}}if(ms<END&&!done)raf=requestAnimationFrame(tick);else finish();}
  $('tpiSkip').addEventListener('click',finish);addEventListener('keydown',e=>{if(e.key==='Escape'&&!done)finish();});
  let seen=false;try{seen=sessionStorage.getItem(key)==='1'}catch(_){}
  const force=Q.get('intro')==='1',busy=/[?&](baseline|score|ch|w|p|seat|view)=/.test(location.search)||!!location.hash;
  if((seen||busy||scr!=='intro')&&!force){box.classList.add('done');done=true;}else{document.documentElement.classList.add('tpi-on');if(reduce){line(T.length-1);setTimeout(finish,2500);}else raf=requestAnimationFrame(tick);}
})();

<script>
/* ---------- the field: 6 generative scenes, cross-faded ---------- */
(function(){
  const cv=document.getElementById('field');if(!cv)return;const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,D,S=0,next=-1,fade=0,t=0,last=performance.now();
  const G=[201,168,76];
  const rgba=(r,g,b,a)=>`rgba(${r|0},${g|0},${b|0},${a})`;
  const gold=(k,a)=>{const m=[[201,168,76],[240,214,150],[156,112,40],[244,239,226]][k&3];return rgba(m[0],m[1],m[2],a);};
  const noise=(x,y,z)=>Math.sin(x*1.7+z)*Math.cos(y*1.3-z*.7)+Math.sin((x+y)*.9+z*.5)*.6+Math.sin(x*3.1-y*2.3+z*1.3)*.25;

  /* 0 · flow — the vortex of decisions */
  const flow={init(){const n=Math.round(Math.min(4200,innerWidth*innerHeight/300));this.p=[];for(let i=0;i<n;i++)this.p.push({x:Math.random()*W,y:Math.random()*H,v:Math.random(),h:Math.random()});this.cx=.62;this.cy=.45;},
    trail:.05,
    draw(){const cx=this.cx+Math.sin(t*.00011)*.08,cy=this.cy+Math.cos(t*.00013)*.06;ctx.globalCompositeOperation='lighter';
      for(const p of this.p){const dx=p.x/W-cx,dy=p.y/H-cy,r=Math.hypot(dx,dy)+1e-4;
        const a=Math.atan2(dy,dx)+Math.PI/2+noise(p.x*.0012,p.y*.0012,t*.0003)*1.1,sp=(.6+p.v*1.7)*D,nx=p.x+Math.cos(a)*sp,ny=p.y+Math.sin(a)*sp;
        const al=.06+Math.max(0,1-r/.6)*.55;ctx.strokeStyle=gold(p.h<.8?0:p.h<.94?1:3,al);ctx.lineWidth=(p.h>.97?2:1)*D;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();p.x=nx;p.y=ny;
        if(p.x<0||p.x>W||p.y<0||p.y>H||Math.random()<.004){p.x=Math.random()*W;p.y=Math.random()*H;}}
      ctx.globalCompositeOperation='source-over';}};

  /* 1 · archive — a corridor of data tiles moving toward you */
  const tunnel={init(){this.cells=[];for(let w=0;w<4;w++)for(let u=0;u<9;u++)for(let z=0;z<34;z++)this.cells.push({w,u,z,b:Math.random()<.16?.6+Math.random()*.4:Math.random()*.16,k:Math.random()<.85?0:(Math.random()<.6?1:2),f:Math.random()*6.28});},
    trail:1,
    draw(){const cx=W/2+Math.sin(t*.0002)*W*.04,cy=H/2+Math.cos(t*.00017)*H*.03,f=Math.min(W,H)*.9,sp=(t*.0016)%1,half=1.4;
      const pr=(X,Y,Z)=>[cx+X/Z*f,cy+Y/Z*f];
      const list=[];for(const c of this.cells){const z=c.z+1-sp;if(z<.35)continue;list.push([z,c]);}
      list.sort((a,b)=>b[0]-a[0]);
      for(const [z,c] of list){const u0=-half+c.u*(2*half/9)+.03,u1=u0+2*half/9*.84,z1=z+.84;
        let q;if(c.w===0)q=[[u0,-half,z],[u1,-half,z],[u1,-half,z1],[u0,-half,z1]];
        else if(c.w===1)q=[[u0,half,z],[u1,half,z],[u1,half,z1],[u0,half,z1]];
        else if(c.w===2)q=[[-half,u0,z],[-half,u1,z],[-half,u1,z1],[-half,u0,z1]];
        else q=[[half,u0,z],[half,u1,z],[half,u1,z1],[half,u0,z1]];
        const depth=Math.max(0,1-z/34)*Math.min(1,(z-.35)/2.5),fl=.45+.55*Math.sin(t*.0025+c.f);
        ctx.fillStyle=gold(c.k,(.03+c.b*.8*fl)*depth);
        ctx.beginPath();q.forEach((P,i)=>{const [x,y]=pr(...P);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fill();}}};

  /* 2 · inner — a breathing sphere of points */
  const sphere={init(){const n=3600;this.pts=[];const ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=ga*i;this.pts.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()]);}},
    trail:.22,
    draw(){const R=Math.min(W,H)*.42,cx=W*.64,cy=H*.5,ay=t*.00022,ax=Math.sin(t*.00013)*.4,ca=Math.cos(ay),sa=Math.sin(ay),cb=Math.cos(ax),sb=Math.sin(ax);
      ctx.globalCompositeOperation='lighter';
      for(const p of this.pts){const d=1+.18*noise(p[0]*2,p[1]*2,t*.0006)+.06*Math.sin(t*.002+p[3]*6);
        let x=p[0]*d,y=p[1]*d,z=p[2]*d;let x1=x*ca+z*sa,z1=-x*sa+z*ca;let y1=y*cb-z1*sb,z2=y*sb+z1*cb;
        const s=1.9/(2.6-z2),X=cx+x1*R*s,Y=cy+y1*R*s,al=.14+(z2+1)*.38;
        ctx.fillStyle=gold(p[3]<.85?0:p[3]<.97?1:3,al);const r=(p[3]>.97?2.6:1.5)*D*s;ctx.fillRect(X-r/2,Y-r/2,r,r);}
      ctx.globalCompositeOperation='source-over';}};

  /* 3 · numbers — a city of rising data columns */
  const columns={init(){this.n=16;},trail:1,
    draw(){const n=this.n,s=Math.min(W,H)/(n*1.15),ox=W*.56,oy=H*.34;
      const iso=(i,j,h)=>[ox+(i-j)*s*.9,oy+(i+j)*s*.52-h];
      for(let k=0;k<2*n-1;k++)for(let i=0;i<n;i++){const j=k-i;if(j<0||j>=n)continue;
        const v=(noise(i*.35,j*.35,t*.0007)+1.6)/3.2,h=Math.max(.02,v*v)*s*7;
        const [x,y]=iso(i,j,h),[xb,yb]=iso(i,j,0),w=s*.9,d=s*.52;
        const a=.05+v*.38;
        ctx.fillStyle=gold(v>.8?1:0,a*1.4);ctx.beginPath();ctx.moveTo(x,y-d);ctx.lineTo(x+w,y);ctx.lineTo(x,y+d);ctx.lineTo(x-w,y);ctx.closePath();ctx.fill();ctx.strokeStyle=gold(1,.15+v*.6);ctx.lineWidth=.8*D;ctx.stroke();
        ctx.fillStyle=rgba(120,88,32,a*.75);ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x,y+d);ctx.lineTo(xb,yb+d);ctx.lineTo(xb-w,yb);ctx.closePath();ctx.fill();
        ctx.fillStyle=rgba(70,52,20,a*.75);ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x,y+d);ctx.lineTo(xb,yb+d);ctx.lineTo(xb+w,yb);ctx.closePath();ctx.fill();}}};

  /* 4 · signal — ridgelines of performance over time */
  const waves={init(){},trail:1,
    draw(){const L=46,top=H*.22,bot=H*.92,x0=W*.28,x1=W*.98;
      for(let l=0;l<L;l++){const y0=top+(bot-top)*l/L,pts=[];
        for(let i=0;i<=120;i++){const u=i/120,x=x0+(x1-x0)*u,c=Math.exp(-Math.pow((u-.55)/.18,2));
          const v=Math.max(0,noise(u*6,l*.35,t*.0009)+.4)*c*H*.09+Math.abs(Math.sin(u*40+l+t*.002))*c*H*.008;pts.push([x,y0-v]);}
        ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineTo(x1,bot+40);ctx.lineTo(x0,bot+40);ctx.closePath();ctx.fillStyle='#000';ctx.fill();
        ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
        const g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,gold(0,0));g.addColorStop(.25,gold(l%9===0?1:0,.25+.6*(l/L)));g.addColorStop(.85,gold(l%9===0?1:0,.25+.6*(l/L)));g.addColorStop(1,gold(0,0));
        ctx.strokeStyle=g;ctx.lineWidth=1.1*D;ctx.stroke();}}};

  /* 5 · network — the relationships that decide */
  const net={init(){const n=Math.round(Math.min(170,innerWidth*innerHeight/9000));this.p=[];for(let i=0;i<n;i++)this.p.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*D,vy:(Math.random()-.5)*.35*D,r:Math.random()});this.pulses=[];},
    trail:.35,
    draw(){const P=this.p,lim=Math.min(W,H)*.17;for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
      ctx.lineWidth=.8*D;
      for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<lim){ctx.strokeStyle=gold(0,(1-d/lim)*.45);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        if(Math.random()<.0009&&this.pulses.length<40)this.pulses.push({a,b,u:0});}}
      for(const p of P){ctx.fillStyle=gold(p.r>.9?3:1,.5+p.r*.5);const r=(1.2+p.r*2.4)*D;ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.fill();}
      ctx.globalCompositeOperation='lighter';
      this.pulses=this.pulses.filter(q=>{q.u+=.02;const x=q.a.x+(q.b.x-q.a.x)*q.u,y=q.a.y+(q.b.y-q.a.y)*q.u;const g=ctx.createRadialGradient(x,y,0,x,y,10*D);g.addColorStop(0,'rgba(244,230,180,.9)');g.addColorStop(1,'rgba(201,168,76,0)');ctx.fillStyle=g;ctx.fillRect(x-10*D,y-10*D,20*D,20*D);return q.u<1;});
      ctx.globalCompositeOperation='source-over';}};

  const SC=[flow,tunnel,sphere,columns,waves,net];
  function size(){D=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';SC.forEach(s=>s.init());ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
  function frame(){const sc=SC[S];
    ctx.fillStyle=`rgba(0,0,0,${sc.trail})`;ctx.fillRect(0,0,W,H);sc.draw();
    if(next>=0){fade+=.045;ctx.fillStyle=`rgba(0,0,0,${Math.min(1,fade)})`;ctx.fillRect(0,0,W,H);if(fade>=1){S=next;next=-1;fade=0;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}}
    t+=16;}
  function loop(){frame();requestAnimationFrame(loop);}
  addEventListener('resize',()=>{clearTimeout(size.t);size.t=setTimeout(size,150);});
  size();
  window.growxField=i=>{i=((i%SC.length)+SC.length)%SC.length;if(i===S&&next<0)return;if(reduce){S=i;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);for(let k=0;k<60;k++)frame();return;}next=i;fade=0;};
  const start=+(document.documentElement.dataset.scene||0);S=start%SC.length;
  if(reduce){for(let k=0;k<80;k++)frame();}else loop();
  /* pages other than the intro: each section brings its own scene */
  if(!document.getElementById('bars')&&'IntersectionObserver' in window){
    const secs=[...document.querySelectorAll('section')];
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)growxField(start+secs.indexOf(e.target));}),{threshold:.4});
    secs.forEach(s=>io.observe(s));}
})();

</script>
